<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Briefly — News in 60 Words</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F7F5F0;
    --card-bg: #FFFFFF;
    --text-primary: #1A1A1A;
    --text-secondary: #666660;
    --text-muted: #999993;
    --accent: #C8441A;
    --border: #E8E5DF;
  }
  body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text-primary); min-height: 100vh; }
  header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 1.25rem 1.5rem; position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 560px; margin: 0 auto; }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .brand h1 { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.5px; }
  .brand span { font-size: 12px; color: var(--accent); font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }
  .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .search-row input { flex: 1; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-primary); outline: none; transition: border-color 0.2s; }
  .search-row input:focus { border-color: var(--text-primary); }
  .search-row button { padding: 10px 20px; background: var(--text-primary); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer; transition: opacity 0.2s; white-space: nowrap; }
  .search-row button:hover { opacity: 0.85; }
  .search-row button:disabled { opacity: 0.5; cursor: not-allowed; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 5px 14px; border-radius: 999px; border: 1.5px solid var(--border); font-size: 12px; font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer; color: var(--text-secondary); background: var(--card-bg); transition: all 0.15s; }
  .chip:hover { border-color: var(--text-primary); color: var(--text-primary); }
  .chip.active { background: var(--text-primary); color: #fff; border-color: var(--text-primary); }
  main { max-width: 560px; margin: 0 auto; padding: 1.5rem 1.5rem 3rem; }
  .meta-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 12px; color: var(--text-muted); }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; animation: fadeUp 0.35s ease forwards; opacity: 0; transform: translateY(10px); }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  .card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .source-badge { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; color: var(--accent); background: #FDF0EC; padding: 3px 8px; border-radius: 4px; }
  .card-title { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 500; line-height: 1.45; color: var(--text-primary); margin-bottom: 10px; }
  .divider { width: 28px; height: 2px; background: var(--accent); border-radius: 2px; margin-bottom: 10px; }
  .card-summary { font-size: 14px; line-height: 1.75; color: var(--text-secondary); font-weight: 300; margin-bottom: 14px; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border); }
  .read-more { font-size: 12px; font-weight: 500; color: var(--text-primary); text-decoration: none; }
  .read-more:hover { color: var(--accent); }
  .word-pill { font-size: 11px; color: var(--text-muted); background: var(--bg); padding: 3px 8px; border-radius: 999px; }
  .status { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); font-size: 14px; }
  .dots span { display: inline-block; animation: blink 1.2s infinite; font-size: 20px; line-height: 1; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
  .status-label { margin-top: 10px; font-size: 13px; color: var(--text-muted); }
  .error-box { background: #FDF0EC; border: 1px solid #F5C4B3; border-radius: 12px; padding: 1.5rem; text-align: center; font-size: 13px; color: #993C1D; margin-top: 1rem; line-height: 1.7; }
  .retry-btn { margin-top: 12px; display: inline-block; padding: 8px 20px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; }
  .powered { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 2rem; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <h1>Briefly</h1>
      <span>News in 60 words</span>
    </div>
    <div class="search-row">
      <input type="text" id="topicInput" placeholder="Search any topic..." value="India" />
      <button id="fetchBtn" onclick="fetchNews()">Get News</button>
    </div>
    <div class="chips">
      <div class="chip active" onclick="setTopic('India', this)">India</div>
      <div class="chip" onclick="setTopic('Technology', this)">Technology</div>
      <div class="chip" onclick="setTopic('Business', this)">Business</div>
      <div class="chip" onclick="setTopic('Sports', this)">Sports</div>
      <div class="chip" onclick="setTopic('World', this)">World</div>
      <div class="chip" onclick="setTopic('Politics', this)">Politics</div>
      <div class="chip" onclick="setTopic('Cricket', this)">Cricket</div>
    </div>
  </div>
</header>

<main>
  <div id="metaBar" class="meta-bar" style="display:none;"></div>
  <div id="feed">
    <div class="status">
      <div class="dots"><span>●</span><span>●</span><span>●</span></div>
      <div class="status-label">Loading today's news...</div>
    </div>
  </div>
  <div class="powered">Powered by Hugging Face · Mistral 7B</div>
</main>

<script>
const HF_TOKEN = "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";
const HF_URL = "https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2";

function setTopic(t, el) {
  document.getElementById("topicInput").value = t;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
  fetchNews();
}

function wordCount(text) {
  return text ? text.split(/\s+/).filter(Boolean).length : 0;
}

function showStatus(msg) {
  document.getElementById("feed").innerHTML = `
    <div class="status">
      <div class="dots"><span>●</span><span>●</span><span>●</span></div>
      <div class="status-label">${msg}</div>
    </div>`;
}

function showError(msg) {
  document.getElementById("feed").innerHTML = `
    <div class="error-box">
      <strong>Could not load news</strong><br/><br/>
      ${msg}<br/><br/>
      <button class="retry-btn" onclick="fetchNews()">Try Again</button>
    </div>`;
}

async function fetchNews() {
  const topic = document.getElementById("topicInput").value.trim() || "India";
  const btn = document.getElementById("fetchBtn");
  const metaBar = document.getElementById("metaBar");

  btn.disabled = true;
  metaBar.style.display = "none";
  showStatus("Searching for latest news...");

  try {
    const prompt = `<s>[INST] You are a news summarizer like the Inshorts app. Give me 8 recent important news stories about "${topic}" from the past 48 hours.

Return ONLY a valid JSON array. No markdown. No explanation. No extra text.

Each object must have exactly these keys:
- "short_title": headline in max 8 words
- "summary": news summary in strictly under 60 words in simple English
- "source": news outlet name like BBC, Reuters, NDTV, Times of India
- "url": article url or "#"

Return ONLY the JSON array starting with [ and ending with ] [/INST]`;

    const response = await fetch(HF_URL, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${HF_TOKEN}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        inputs: prompt,
        parameters: {
          max_new_tokens: 2000,
          temperature: 0.4,
          return_full_text: false
        }
      })
    });

    if (!response.ok) {
      const errData = await response.json();
      // Model loading - retry after delay
      if (response.status === 503) {
        showStatus("Model is loading, retrying in 20 seconds...");
        setTimeout(fetchNews, 20000);
        btn.disabled = false;
        return;
      }
      throw new Error(errData.error || "API call failed. Please try again.");
    }

    const data = await response.json();

    // HF returns array with generated_text
    let raw = "";
    if (Array.isArray(data) && data[0]?.generated_text) {
      raw = data[0].generated_text;
    } else if (data.generated_text) {
      raw = data.generated_text;
    } else {
      throw new Error("Unexpected response format. Please try again.");
    }

    const clean = raw.replace(/```json|```/g, "").trim();
    const startIdx = clean.indexOf("[");
    const endIdx = clean.lastIndexOf("]");
    if (startIdx === -1 || endIdx === -1) throw new Error("Could not read news data. Please try again.");

    const articles = JSON.parse(clean.substring(startIdx, endIdx + 1));

    if (!articles.length) {
      showError(`No news found for "<strong>${topic}</strong>". Try a different topic.`);
      btn.disabled = false;
      return;
    }

    const feed = document.getElementById("feed");
    feed.innerHTML = "";
    metaBar.style.display = "flex";
    metaBar.innerHTML = `<span>${articles.length} articles</span><span>${topic} · Just now</span>`;

    articles.forEach((a, i) => {
      const wc = wordCount(a.summary);
      const card = document.createElement("div");
      card.className = "card";
      card.style.animationDelay = `${i * 0.07}s`;
      card.innerHTML = `
        <div class="card-meta">
          <span class="source-badge">${a.source || "News"}</span>
        </div>
        <div class="card-title">${a.short_title}</div>
        <div class="divider"></div>
        <div class="card-summary">${a.summary}</div>
        <div class="card-footer">
          <a class="read-more" href="${a.url && a.url !== '#' ? a.url : '#'}" target="_blank">Read full story →</a>
          <span class="word-pill">${wc} words</span>
        </div>`;
      feed.appendChild(card);
    });

  } catch (err) {
    showError(err.message);
  }

  btn.disabled = false;
}

document.getElementById("topicInput").addEventListener("keydown", e => {
  if (e.key === "Enter") fetchNews();
});

fetchNews();
</script>
</body>
</html>
